services:
  server:
    build:
      context: .
      target: server
    image: fancave-server
    restart: unless-stopped
    environment:
      PORT: 2567
    expose:
      - '2567'
    stop_grace_period: 10s

  web:
    build:
      context: .
      target: web
    image: fancave-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
